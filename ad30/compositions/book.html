<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      #book-root { position: absolute; inset: 0; background: #0b1a31; overflow: hidden; }
      #book-video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #book-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
    </style>
  </head>
  <body>
    <!-- The 3D book stack is pre-rendered from tools/book3d-scene.html by tools/render_book3d.mjs
         (local 0 = 10.6 s in the film; the drop lands at local 1.4 = 12.0 s). -->
    <div id="book-root" data-composition-id="book" data-start="0" data-duration="24.9" data-width="1080" data-height="1920">
      <video id="book-video" class="clip" data-start="0" data-duration="24.9" data-track-index="1" src="assets/book3d.mp4" muted playsinline></video>
      <div id="book-flash"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#book-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 1.4);
      window.__timelines = window.__timelines || {};
      window.__timelines["book"] = tl;
    </script>
  </body>
</html>
