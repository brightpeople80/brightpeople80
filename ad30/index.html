<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>The Life You Keep Planning: 30 s ad</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 100 900; src: url("assets/fonts/Montserrat-normal.woff2") format("woff2"); }
      @font-face { font-family: "Roboto"; font-weight: 100 900; src: url("assets/fonts/Roboto-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1a31; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35.5" data-width="1080" data-height="1920">
      <!-- scenes, back to back -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="10.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="book" data-composition-id="book" data-composition-src="compositions/book.html"
        data-start="10.6" data-duration="24.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- overlays -->
      <div id="inside" data-composition-id="inside" data-composition-src="compositions/inside.html"
        data-start="18.3" data-duration="5.1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="26.7" data-duration="8.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <!-- every caption group -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="35.5" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <!-- voice + original score, pre-mixed to -14 LUFS -->
      <audio id="soundtrack" src="assets/soundtrack.wav" data-start="0" data-duration="35.5" data-volume="1" data-track-index="4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
