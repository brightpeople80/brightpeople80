<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Montserrat";src:url("../../instagram-foundation/assets/Montserrat-normal.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Source Serif 4";src:url("../../instagram-foundation/assets/SourceSerif4-italic.woff2") format("woff2");font-weight:200 900;font-style:italic}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.f{position:relative;width:1080px;height:1920px;font-family:"Montserrat",Arial,sans-serif;color:#fff}
/* corner badge shown during the story scenes */
.badge{position:absolute;left:56px;top:236px;display:flex;align-items:center;gap:18px;padding:14px 26px 14px 14px;border-radius:18px;
  background:rgba(7,17,31,.72);border:2px solid rgba(251,195,18,.65);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.badge img{width:78px;border-radius:4px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.badge .t{display:flex;flex-direction:column;gap:4px}
.badge .a{font-weight:800;font-size:24px;letter-spacing:.03em;color:#fff}
.badge .b{font-weight:700;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#fbc312}
/* price and date cards over the paperback scene */
.top{position:absolute;left:80px;right:80px;top:240px;text-align:center;display:flex;flex-direction:column;gap:8px}
.top .k{font-weight:700;font-size:28px;letter-spacing:.24em;text-transform:uppercase;color:#fbc312}
.top .n{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:40px;color:#f4eddc}
.card{position:absolute;left:150px;right:150px;top:1110px;padding:34px 40px;border-radius:28px;text-align:center;
  background:rgba(7,17,31,.82);border:3px solid #fbc312;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px;align-items:center}
.card .l{font-weight:700;font-size:34px;letter-spacing:.2em;text-transform:uppercase;color:#f4eddc}
.card .v{font-weight:800;font-size:120px;line-height:1.02;color:#fbc312}
.card .v.s{font-size:84px}
.card .x{font-weight:700;font-size:36px;letter-spacing:.06em;color:#fff}
.chip{position:absolute;left:50%;top:1170px;transform:translateX(-50%);white-space:nowrap;background:#fbc312;color:#0b1a31;font-weight:800;font-size:44px;letter-spacing:.04em;padding:30px 54px;border-radius:999px;text-transform:uppercase;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.sub{position:absolute;left:0;right:0;top:1310px;text-align:center;font-weight:700;font-size:32px;color:#f4eddc;letter-spacing:.05em}
</style></head><body><div id="r"></div>
<script>
const head=`<div class="top"><div class="k">The Life You Keep Planning</div><div class="n">by Belinda Bright N.</div></div>`;
const F={
 badge:`<div class="f"><div class="badge"><img src="../../instagram-foundation/assets/front-cover.png"><div class="t"><div class="a">The Life You Keep Planning</div><div class="b">Out 23 Jan 2027</div></div></div></div>`,
 head:`<div class="f">${head}</div>`,
 p1:`<div class="f"><div class="card"><div class="l">Kindle edition</div><div class="v">£3.99</div><div class="x">Pre-order now</div></div></div>`,
 p2:`<div class="f"><div class="card"><div class="l">Paperback</div><div class="v">£9.99</div><div class="x">Coming soon</div></div></div>`,
 p3:`<div class="f"><div class="card"><div class="l">Launch day</div><div class="v s">23 January 2027</div></div></div>`,
 p4:`<div class="f"><div class="chip">Pre-order your copy today</div><div class="sub">Amazon UK · link in bio</div></div>`,
};
document.getElementById('r').innerHTML=F[new URLSearchParams(location.search).get('id')]||'';
</script></body></html>
