<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Montserrat";src:url("../../instagram-foundation/assets/Montserrat-normal.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Source Serif 4";src:url("../../instagram-foundation/assets/SourceSerif4-italic.woff2") format("woff2");font-weight:200 900;font-style:italic}
:root{--navy:#0b1a31;--navy2:#13284a;--gold:#fbc312;--cream:#f4eddc}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;overflow:hidden}
.f{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Montserrat",Arial,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 30%,var(--navy2) 0%,var(--navy) 60%,#07111f 100%)}
.rays{position:absolute;left:50%;top:580px;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(251,195,18,.0) 0deg 7deg,rgba(251,195,18,.55) 9deg,rgba(251,195,18,0) 11deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 60%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 25%,transparent 60%)}
.halo{position:absolute;left:50%;top:580px;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;
  background:radial-gradient(circle,rgba(251,195,18,.55) 0%,rgba(251,195,18,.18) 35%,transparent 65%)}
canvas{position:absolute;inset:0}
.cov{position:absolute;left:320px;top:250px;width:440px;height:660px;perspective:1600px}
.cov .in{position:absolute;inset:0;transform-origin:50% 50%;border-radius:6px;overflow:hidden}
.cov img{width:100%;height:100%;display:block}
.shine{position:absolute;top:-20%;left:-60%;width:40%;height:140%;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fffbe8 0%,#fbd85a 35%,#fbc312 60%,rgba(251,195,18,.85) 100%)}
.txt{position:absolute;left:90px;right:90px;top:960px;text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center}
.s{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:48px;color:var(--cream);line-height:1.3}
.d{font-weight:800;font-size:46px}
.chip{background:var(--gold);color:var(--navy);font-weight:800;font-size:34px;letter-spacing:.05em;padding:22px 40px;border-radius:999px;text-transform:uppercase}
.p{font-weight:600;font-size:30px;color:rgba(244,237,220,.75)}
/* website section */
.phone{position:absolute;left:280px;top:250px;width:520px;height:975px;border-radius:64px;background:#05080e;padding:18px;
  box-shadow:0 0 0 3px rgba(251,195,18,.55),0 40px 90px rgba(0,0,0,.6),0 0 120px rgba(251,195,18,.18)}
.screen{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:#fff}
.screen img{position:absolute;left:0;top:0;width:484px}
.urlbar{position:absolute;left:0;right:0;top:0;height:64px;background:rgba(9,27,52,.96);display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:600;font-size:19px;color:#f4eddc;z-index:2}
.urlbar .lock{width:14px;height:16px;border:2px solid #fbc312;border-radius:3px}
.cap{position:absolute;left:70px;right:70px;top:1248px;text-align:center;font-weight:800;font-size:60px;line-height:1.15;text-wrap:balance;
  text-shadow:0 4px 22px rgba(7,17,31,.9)}
.cap .g{color:var(--gold)}
.url{position:absolute;left:0;right:0;top:1390px;text-align:center;font-weight:700;font-size:34px;color:var(--cream);letter-spacing:.01em}
.kick{position:absolute;left:0;right:0;top:200px;text-align:center;font-weight:700;font-size:28px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.tap{position:absolute;width:90px;height:90px;border-radius:50%;border:5px solid #fbc312;background:rgba(251,195,18,.25)}
</style></head><body>
<div class="f" id="f"></div>
<script>
const ID=new URLSearchParams(location.search).get('id');
const F=document.getElementById('f');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
// deterministic random
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};

if(ID==='reveal'){
  F.innerHTML=`<div class="bg" id="bg"></div><div class="rays" id="rays"></div><div class="halo" id="halo"></div><canvas id="cv" width="1080" height="1920"></canvas>
  <div class="cov"><div class="in" id="cin"><img src="../../instagram-foundation/assets/front-cover.png"><div class="shine" id="sh"></div></div></div>
  <div class="txt"><div class="s" id="t1">You don't need another plan.<br>You need a way to begin.</div><div class="d" id="t2">Out 23 January 2027</div><div class="chip" id="t3">Pre-order on Kindle · £3.99</div><div class="p" id="t4">Amazon UK · link in bio</div></div>
  <div class="flash" id="fl"></div>`;
  const P=[];for(let i=0;i<140;i++)P.push({a:rnd()*Math.PI*2,r:500+rnd()*700,s:2+rnd()*5,d:rnd()*0.5,v:20+rnd()*40,x:rnd()*1080,y:rnd()*1920,ph:rnd()*6});
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');
  window.render=t=>{
    // flash covers the cut from the previous scene, then reveals the navy stage
    document.getElementById('bg').style.opacity=seg(t,0,0.3);
    const fl=t<0.3?seg(t,0,0.3):1-seg(t,0.3,1.0);
    document.getElementById('fl').style.opacity=fl;
    const rays=document.getElementById('rays');
    rays.style.opacity=(0.75*eo(seg(t,0.4,1.0)))*(1-0.6*seg(t,1.4,3.5));
    rays.style.transform=`rotate(${t*9}deg) scale(${0.6+0.4*eo(seg(t,0.4,1.4))})`;
    document.getElementById('halo').style.opacity=(0.9*eo(seg(t,0.4,1.1)))*(1-0.55*seg(t,1.4,3.5));
    // cover entrance: spins in from depth, overshoots slightly, settles, then breathes
    const k=seg(t,0.45,1.65);
    const sc=k<=0?0.12:0.12+0.88*eob(k);
    const ry=(1-eo(k))*-75;
    const zoom=1+0.035*eio(seg(t,3.5,12));
    const glow=18+60*Math.max(0,1-Math.abs(t-1.6)/1.2);
    const cin=document.getElementById('cin');
    cin.style.opacity=seg(t,0.45,0.7);
    cin.style.transform=`scale(${sc*zoom}) rotateY(${ry}deg)`;
    cin.style.boxShadow=`0 40px 70px rgba(0,0,0,.55),0 0 ${glow}px rgba(251,195,18,${0.35+0.4*Math.max(0,1-Math.abs(t-1.6)/1.2)})`;
    document.getElementById('sh').style.left=(-60+180*eio(seg(t,1.75,2.55)))+'%';
    // text builds after the reveal
    [['t1',2.1],['t2',2.5],['t3',2.9],['t4',3.2]].forEach(([id,a])=>{const e=document.getElementById(id);const q=eo(seg(t,a,a+0.45));e.style.opacity=q;e.style.transform=`translateY(${(1-q)*24}px)`});
    // particles: spiral into the cover, then drift upward as gold dust
    cx.clearRect(0,0,1080,1920);
    for(const p of P){
      let x,y,al;
      const ki=seg(t,0.25+p.d,1.5+p.d);
      if(ki<1){const r=p.r*(1-eio(ki));const a=p.a+ki*3.2;x=540+Math.cos(a)*r;y=580+Math.sin(a)*r*1.2;al=t<0.25+p.d?0:Math.min(1,ki*3)*(1-ki*0.6);}
      else{const tt=t-(1.5+p.d);x=p.x+Math.sin(tt*0.8+p.ph)*20;y=((p.y-tt*p.v)%1920+1920)%1920;al=0.35*seg(t,1.6,2.4);}
      cx.beginPath();cx.fillStyle=`rgba(251,${200+Math.floor(p.s*8)},90,${al})`;cx.arc(x,y,p.s,0,7);cx.fill();
    }
  };
  window.DUR=10.3;
}

if(ID==='web'){
  F.innerHTML=`<div class="bg" style="opacity:1"></div><div class="halo" style="top:770px;opacity:.35"></div><div class="kick" id="kk">Free on my website</div>
  <div class="phone" id="ph"><div class="screen"><div class="urlbar"><span class="lock"></span>thelifeyoukeepplanningbook.netlify.app</div><img id="shot" src="site/full-mobile.png"></div></div>
  <div class="tap" id="tap" style="opacity:0"></div>
  <div class="cap" id="c1">Not sure <span class="g">where to start?</span></div>
  <div class="cap" id="c2">Take the <span class="g">free quiz</span> on my website</div>
  <div class="cap" id="c3">Which pattern is <span class="g">keeping you stuck?</span></div>
  <div class="cap" id="c4">The link is in <span class="g">my bio</span></div>
  <div class="url" id="u">thelifeyoukeepplanningbook.netlify.app</div>`;
  const S=484/360; // screenshot scale inside the phone
  window.render=t=>{
    const ph=document.getElementById('ph');const q=eo(seg(t,0,0.6));
    ph.style.opacity=q;ph.style.transform=`translateY(${(1-q)*80}px) scale(${0.94+0.06*q})`;
    document.getElementById('kk').style.opacity=eo(seg(t,0.2,0.7));
    // scroll from the hero to the quiz while the voice says "free quiz on my website"
    const scroll=eio(seg(t,1.9,3.6))*(5600*S-64);
    document.getElementById('shot').style.top=(64-scroll)+'px';
    // a tap pulse on the first quiz option, as if starting the quiz
    const tp=seg(t,4.6,5.6);const tap=document.getElementById('tap');
    tap.style.left=(280+18+64-45)+'px';tap.style.top=(250+18+128+(5910-5600)*S-45)+'px';
    tap.style.opacity=tp>0&&tp<1?Math.sin(tp*Math.PI):0;tap.style.transform=`scale(${0.6+0.8*tp})`;
    const cap=(id,a,b)=>{const e=document.getElementById(id);const v=Math.min(eo(seg(t,a,a+0.25)),1-seg(t,b-0.25,b));e.style.opacity=v;e.style.transform=`translateY(${(1-eo(seg(t,a,a+0.25)))*20}px)`};
    cap('c1',0.25,1.6);cap('c2',1.7,3.5);cap('c3',3.6,6.1);cap('c4',6.2,8.2);
    document.getElementById('u').style.opacity=eo(seg(t,6.3,6.8));
  };
  window.DUR=8;
}
window.ready=Promise.all([document.fonts.ready,...Array.from(document.images).map(i=>i.complete?1:new Promise(r=>i.onload=r))]);
</script></body></html>
