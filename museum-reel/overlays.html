<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Montserrat";src:url("../instagram-foundation/assets/Montserrat-normal.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Source Serif 4";src:url("../instagram-foundation/assets/SourceSerif4-italic.woff2") format("woff2");font-weight:200 900;font-style:italic}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.f{position:relative;width:1080px;height:1920px;font-family:"Montserrat",Arial,sans-serif;color:#fff}
/* caption band sits inside Instagram's safe zone */
.cap{position:absolute;left:90px;right:90px;top:260px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.cap .k{font-weight:700;font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:#fbc312;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.cap .t{font-weight:800;font-size:74px;line-height:1.08;text-shadow:0 4px 24px rgba(7,17,31,.85),0 2px 4px rgba(7,17,31,.9)}
.cap .t .g{color:#fbc312}
.shade{position:absolute;left:0;right:0;top:0;height:720px;background:linear-gradient(180deg,rgba(7,17,31,.75),rgba(7,17,31,0))}
/* end card */
.end{background:radial-gradient(120% 90% at 30% 10%,#13284a 0%,#0b1a31 60%,#07111f 100%)}
.end img{position:absolute;left:290px;top:330px;width:500px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.6))}
.end .txt{position:absolute;left:90px;right:90px;top:1150px;text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center}
.end .s{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:48px;color:#f4eddc;line-height:1.3}
.end .d{font-weight:800;font-size:46px}
.end .chip{background:#fbc312;color:#0b1a31;font-weight:800;font-size:34px;letter-spacing:.05em;padding:22px 40px;border-radius:999px;text-transform:uppercase}
.end .p{font-weight:600;font-size:30px;color:rgba(244,237,220,.75)}
</style></head><body><div id="r"></div>
<script>
const F={
c1:`<div class="f"><div class="shade"></div><div class="cap"><div class="k">Now open</div><div class="t">The Museum of<br><span class="g">Unfinished Dreams</span></div></div></div>`,
c2:`<div class="f"><div class="shade"></div><div class="cap"><div class="t">Every exhibit was<br>a good idea.</div></div></div>`,
c3:`<div class="f"><div class="shade"></div><div class="cap"><div class="t">Don't start a new one.<br><span class="g">Finish one that's here.</span></div></div></div>`,
end:`<div class="f end"><img src="../instagram-foundation/assets/front-cover.png"><div class="txt"><div class="s">You don't need another plan.<br>You need a way to begin.</div><div class="d">Out 23 January 2027</div><div class="chip">Pre-order on Kindle · £3.99</div><div class="p">Amazon UK · link in bio</div></div></div>`
};
document.getElementById('r').innerHTML=F[new URLSearchParams(location.search).get('id')]||'';
</script></body></html>
