<script type="module">
import * as THREE from './vendor/three.module.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const DURATION = 33.0;
window.DURATION = DURATION;
const params = new URLSearchParams(location.search);

// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const k = (t, a, b) => clamp((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bo = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ------------------------------------------------------------------ renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#07111f');
scene.fog = new THREE.Fog('#07111f', 90, 180);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environmentIntensity = 0.3;
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.5, 300);

scene.add(new THREE.HemisphereLight('#c9d6f0', '#0b1424', 0.32));
const key = new THREE.DirectionalLight('#ffe9c4', 1.15);
key.position.set(-14, 26, 16); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0006;
Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
scene.add(key);
const rim = new THREE.DirectionalLight('#8fb3ff', 0.55); rim.position.set(16, 10, -14); scene.add(rim);
const fill = new THREE.PointLight('#ffd38a', 6, 40, 1.6); fill.position.set(4, 9, 14); scene.add(fill);

// ------------------------------------------------------------------ textures
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  if (repeat) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(repeat, repeat); }
  tx.userData = { cv, g, draw }; return tx;
}
const grain = (g, w, h, base, amt) => { g.fillStyle = base; g.fillRect(0, 0, w, h);
  const id = g.getImageData(0, 0, w, h); for (let i = 0; i < id.data.length; i += 4) { const n = (rnd() - .5) * amt; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n; } g.putImageData(id, 0, 0); };
const brushed = (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#d9b56a'); gr.addColorStop(.5, '#b08a3e'); gr.addColorStop(1, '#cfa75a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < h * 1.4; i++) { g.strokeStyle = `rgba(${rnd() < .5 ? '255,240,200' : '60,40,10'},${rnd() * .12})`; g.lineWidth = rnd() * 1.4; const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (rnd() - .5) * 2); g.stroke(); } };
const loadTex = src => new Promise(r => new THREE.TextureLoader().load(src, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; r(t); }));

const navyTex = canvasTex(256, 256, (g, w, h) => grain(g, w, h, '#13284a', 14), 6);
const tableTex = canvasTex(256, 256, (g, w, h) => grain(g, w, h, '#0e2140', 12), 40);
const ivoryTex = canvasTex(256, 256, (g, w, h) => grain(g, w, h, '#f1e9d6', 10), 3);
const brassTex = canvasTex(512, 256, brushed);
const M = {
  navy: new THREE.MeshStandardMaterial({ map: navyTex, roughness: .92, metalness: 0 }),
  navyDeep: new THREE.MeshStandardMaterial({ color: '#0d1d36', map: navyTex, roughness: .95 }),
  ivory: new THREE.MeshStandardMaterial({ color: '#eee5cf', map: ivoryTex, roughness: .96 }),
  brass: new THREE.MeshStandardMaterial({ map: brassTex, metalness: .85, roughness: .32, envMapIntensity: 3.5 }),
  gold: new THREE.MeshStandardMaterial({ color: '#fbc312', emissive: '#f2b200', emissiveIntensity: .75, metalness: .3, roughness: .35 }),
  table: new THREE.MeshStandardMaterial({ map: tableTex, roughness: 1 }),
};
const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; };
const unitBox = mat => box(1, 1, 1, mat);
const faceMats = (side, front, back) => [side, side, side, side, front, back || side];

// ------------------------------------------------------------------ gold line
const Y = V(0, 1, 0);
function seg(r = .07) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), M.gold); m.visible = false; scene.add(m); return m; }
function setSeg(m, a, b, f = 1) {
  if (f <= 0.001) { m.visible = false; return; }
  const e = a.clone().lerp(b, f), d = e.clone().sub(a), L = d.length(); if (L < 1e-4) { m.visible = false; return; }
  m.visible = true; m.position.copy(a).add(e).multiplyScalar(.5); m.quaternion.setFromUnitVectors(Y, d.normalize()); m.scale.set(1, L, 1);
}
function tube(points, r = .07, segs = 240) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', .25);
  const g = new THREE.TubeGeometry(curve, segs, r, 8, false); const m = new THREE.Mesh(g, M.gold); m.userData.segs = segs; scene.add(m); return m;
}
const drawTube = (m, f) => { m.visible = f > 0.002; m.geometry.setDrawRange(0, Math.floor(clamp(f) * m.userData.segs) * 8 * 6); };
const dot = () => { const m = new THREE.Mesh(new THREE.SphereGeometry(.16, 16, 12), M.gold); m.visible = false; scene.add(m); return m; };

// ------------------------------------------------------------------ build
const B = {};
async function build() {
  await Promise.all(['800 60px Montserrat', '900 60px Montserrat', '600 60px Montserrat', '600 60px "Source Serif 4"', 'italic 600 60px "Source Serif 4"', '600 60px Caveat']
    .map(f => document.fonts.load(f)));
  const [frontT, spineT, backT] = await Promise.all(['assets/front-cover.png', 'assets/spine.png', 'assets/back-cover.png'].map(loadTex));

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), M.table); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // ---- SOMEDAY drawer
  const cab = new THREE.Group(); cab.position.set(0, 0, -16); scene.add(cab);
  const body = box(19, 8.6, 12, M.navyDeep); body.position.set(0, 4.3, 0); cab.add(body);
  const top = box(19.6, .5, 12.6, M.navy); top.position.set(0, 8.85, 0); cab.add(top);
  const drawer = new THREE.Group(); cab.add(drawer); B.drawer = drawer;
  const front = box(17, 6.6, .7, M.navy); front.position.set(0, 4.4, 6.35); drawer.add(front);
  const tray = [box(16, .3, 11, M.navyDeep), box(.3, 5, 11, M.navyDeep), box(.3, 5, 11, M.navyDeep), box(16, 5, .3, M.navyDeep)];
  tray[0].position.set(0, 1.4, .5); tray[1].position.set(-7.85, 3.8, .5); tray[2].position.set(7.85, 3.8, .5); tray[3].position.set(0, 3.8, -5);
  tray.forEach(m => drawer.add(m));
  const plateT = canvasTex(1040, 300, (g, w, h) => {
    brushed(g, w, h); g.strokeStyle = 'rgba(70,45,10,.55)'; g.lineWidth = 6; g.strokeRect(14, 14, w - 28, h - 28);
    for (const [x, y] of [[44, 44], [w - 44, 44], [44, h - 44], [w - 44, h - 44]]) { g.fillStyle = '#7a5a1e'; g.beginPath(); g.arc(x, y, 12, 0, 7); g.fill(); g.fillStyle = '#f0d58f'; g.beginPath(); g.arc(x - 3, y - 3, 5, 0, 7); g.fill(); }
    g.font = '800 150px Montserrat'; g.textAlign = 'center'; g.textBaseline = 'middle'; if (g.letterSpacing !== undefined) g.letterSpacing = '22px';
    g.fillStyle = 'rgba(255,240,190,.85)'; g.fillText('SOMEDAY', w / 2 + 11, h / 2 + 15);
    g.fillStyle = '#3c2a0c'; g.fillText('SOMEDAY', w / 2 + 11, h / 2 + 10);
  });
  const plate = box(5.2, 1.5, .16, faceMats(M.brass, new THREE.MeshStandardMaterial({ map: plateT, metalness: .75, roughness: .35, envMapIntensity: 1.3 })));
  plate.position.set(0, 5.75, 6.78); drawer.add(plate);
  const pull = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, 4.4, 20), M.brass); pull.rotation.z = Math.PI / 2; pull.position.set(0, 3.5, 7.35); pull.castShadow = true; drawer.add(pull);
  for (const x of [-2, 2]) { const p = box(.3, .3, .7, M.brass); p.position.set(x, 3.5, 7.0); drawer.add(p); }

  // ---- goal card
  const cardT = canvasTex(1400, 840, (g, w, h) => {
    grain(g, w, h, '#f4eddc', 10); g.strokeStyle = 'rgba(11,26,49,.10)'; g.lineWidth = 3;
    for (let y = 250; y < h - 60; y += 110) { g.beginPath(); g.moveTo(70, y); g.lineTo(w - 70, y); g.stroke(); }
    g.strokeStyle = '#d9534f55'; g.beginPath(); g.moveTo(150, 0); g.lineTo(150, h); g.stroke();
    g.fillStyle = '#0b1a31'; g.font = '700 150px Caveat'; g.textBaseline = 'alphabetic';
    g.fillText('Start my', 200, 345); g.fillText('food business.', 200, 560);
  });
  B.card = box(7, 4.2, .05, faceMats(M.ivory, new THREE.MeshStandardMaterial({ color: '#ece3cd', map: cardT, roughness: .95 }), M.ivory)); scene.add(B.card);

  // ---- kitchen (paper model)
  const kit = new THREE.Group(); kit.position.set(0, 0, 0); scene.add(kit); B.kit = kit;
  const panelP = new THREE.Group(); panelP.position.set(0, 0, 1); kit.add(panelP); B.panelP = panelP;
  const panel = box(16, 10, .18, M.navy); panel.position.set(0, 5, 0); panelP.add(panel);
  for (const x of [-5.6, 5.6]) { const c = box(4, 2.6, 1.4, M.ivory); c.position.set(x, 8.2, .8); panelP.add(c);
    const k1 = box(.12, .7, .12, M.brass); k1.position.set(x + (x < 0 ? 1.6 : -1.6), 7.5, 1.55); panelP.add(k1); }
  const rail = new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, 4, 10), M.brass); rail.rotation.z = Math.PI / 2; rail.position.set(-3.2, 6.1, .4); panelP.add(rail);
  for (let i = 0; i < 3; i++) { const u = box(.14, 1.4, .1, M.brass); u.position.set(-4.4 + i * 1.2, 5.35, .45); panelP.add(u); }
  const counterBody = new THREE.Group(); counterBody.position.set(0, 0, 3); kit.add(counterBody); B.counterBody = counterBody;
  const doorT = canvasTex(1400, 400, (g, w, h) => { grain(g, w, h, '#f1e9d6', 8); g.strokeStyle = 'rgba(11,26,49,.35)'; g.lineWidth = 4;
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 30); g.lineTo(i * w / 4, h); g.stroke(); }
    g.fillStyle = '#b08a3e'; for (let i = 0; i < 4; i++) g.fillRect(i * w / 4 + (i % 2 ? 30 : w / 4 - 70), 90, 40, 12); });
  const cb = box(14, 4, 3.6, faceMats(M.ivory, new THREE.MeshStandardMaterial({ color: '#e6dcc4', map: doorT, roughness: .95 }))); cb.position.set(0, 2, 0); counterBody.add(cb);
  B.top = unitBox(M.navy); scene.add(B.top);      // counter top -> table top -> book blank
  B.legs = [-1, 1].flatMap(sx => [-1, 1].map(sz => { const l = box(.45, 1, .45, M.navy); l.userData.p = [sx * 6.3, sz * 2.9]; scene.add(l); return l; }));
  const hob = new THREE.Group(); scene.add(hob); B.hob = hob;
  for (const [x, z] of [[3.4, 2.6], [5.4, 2.6]]) { const r = new THREE.Mesh(new THREE.TorusGeometry(.6, .08, 8, 30), M.brass); r.rotation.x = Math.PI / 2; r.position.set(x, 0, z); hob.add(r); }
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(.75, .7, 1, 28), M.ivory); pot.position.set(5.4, .55, 2.6); pot.castShadow = true; hob.add(pot);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(.8, .8, .1, 28), M.brass); lid.position.set(5.4, 1.08, 2.6); hob.add(lid);

  // ---- meal boxes + price tag
  const boxLabel = canvasTex(400, 400, (g, w, h) => { grain(g, w, h, '#f4eddc', 8); g.fillStyle = '#0b1a31'; g.fillRect(0, 150, w, 100); g.fillStyle = '#fbc312'; g.beginPath(); g.arc(w / 2, 200, 38, 0, 7); g.fill(); });
  B.meals = [0, 1].map(() => { const g = new THREE.Group(); const b = box(2.3, 1.3, 1.9, faceMats(new THREE.MeshStandardMaterial({ map: boxLabel, roughness: .95 }), new THREE.MeshStandardMaterial({ map: boxLabel, roughness: .95 })));
    b.position.y = .65; g.add(b); const band = box(2.36, .2, 1.96, M.navy); band.position.y = 1.32; g.add(band); scene.add(g); return g; });
  const tagT = canvasTex(600, 380, (g, w, h) => { grain(g, w, h, '#f4eddc', 8); g.strokeStyle = '#b08a3e'; g.lineWidth = 14; g.strokeRect(10, 10, w - 20, h - 20);
    g.fillStyle = '#0b1a31'; g.font = '900 190px Montserrat'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('£12', w / 2, h / 2 + 10); });
  B.tag = new THREE.Group(); scene.add(B.tag);
  const tagCard = box(1.9, 1.2, .06, faceMats(M.brass, new THREE.MeshStandardMaterial({ map: tagT, roughness: .9 }), M.ivory)); tagCard.position.y = 1.45; B.tag.add(tagCard);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .9, 8), M.brass); stem.position.y = .45; B.tag.add(stem);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(.35, .35, .08, 20), M.brass); B.tag.add(foot);

  // ---- speech bubbles
  function bubble(w, h, text, size) {
    const s = new THREE.Shape(), r = .55, x0 = -w / 2, y0 = -h / 2;
    s.moveTo(x0 + r, y0); s.lineTo(-w * .22, y0); s.lineTo(-w * .26, y0 - .75); s.lineTo(-w * .06, y0); s.lineTo(x0 + w - r, y0); s.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r); s.lineTo(x0 + w, y0 + h - r); s.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    s.lineTo(x0 + r, y0 + h); s.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r); s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: .1, bevelEnabled: true, bevelThickness: .03, bevelSize: .03, bevelSegments: 2 }), [M.ivory, M.gold]);
    m.castShadow = true; g.add(m);
    const tt = canvasTex(Math.round(w * 200), Math.round(h * 200), (c, W, H) => { c.fillStyle = '#0b1a31'; c.font = `800 ${size}px Montserrat`; const mw = c.measureText(text).width; if (mw > W * .86) c.font = `800 ${Math.floor(size * W * .86 / mw)}px Montserrat`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, W / 2, H / 2 + 6); });
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tt, transparent: true })); p.position.z = .14; g.add(p);
