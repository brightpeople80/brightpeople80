<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Foundation frames</title>
<style>
@font-face{font-family:"Montserrat";src:url("../assets/Montserrat-normal.woff2") format("woff2");font-weight:100 900}
@font-face{font-family:"Source Serif 4";src:url("../assets/SourceSerif4-normal.woff2") format("woff2");font-weight:200 900}
@font-face{font-family:"Source Serif 4";src:url("../assets/SourceSerif4-italic.woff2") format("woff2");font-weight:200 900;font-style:italic}
:root{--navy:#0b1a31;--navy2:#13284a;--gold:#fbc312;--gold-deep:#c99a2e;--cream:#f4eddc;--white:#ffffff;--ink:#0b1a31}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
.frame{position:relative;overflow:hidden;font-family:"Montserrat",Arial,sans-serif;color:var(--white)}
.feed{width:1080px;height:1350px}
.story{width:1080px;height:1920px}
.navy{background:radial-gradient(120% 90% at 30% 10%,var(--navy2) 0%,var(--navy) 60%,#07111f 100%)}
.cream{background:var(--cream);color:var(--ink)}
.gold-bg{background:var(--gold);color:var(--ink)}
.pad{position:absolute;inset:96px 96px 150px 96px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.story .pad{inset:300px 100px 380px 100px}
.kicker{font-weight:700;font-size:30px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.cream .kicker{color:var(--gold-deep)}
.h1{font-weight:800;font-size:96px;line-height:1.02;letter-spacing:-.01em;text-transform:uppercase}
.h2{font-weight:800;font-size:72px;line-height:1.08;letter-spacing:-.005em}
.h3{font-weight:700;font-size:54px;line-height:1.15}
.serif{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-weight:400}
.lead{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:52px;line-height:1.3;color:var(--cream)}
.cream .lead{color:#3a404b}
.body{font-weight:500;font-size:44px;line-height:1.35;color:var(--cream)}
.cream .body{color:#2a2f38}
.gold{color:var(--gold)}
.cream .gold{color:var(--gold-deep)}
.rule{width:120px;height:6px;background:var(--gold);border-radius:3px}
.lines{display:flex;flex-direction:column;gap:22px}
.lines .h2 + .h2{margin-top:0}
.dim{opacity:.55}
.foot{position:absolute;left:96px;right:96px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,237,220,.6)}
.cream .foot{color:rgba(11,26,49,.5)}
.foot .n{font-variant-numeric:tabular-nums;letter-spacing:.08em}
.swipe{display:inline-flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:28px}
.list .it{display:flex;gap:28px;align-items:flex-start;font-weight:600;font-size:46px;line-height:1.25}
.list .it .b{flex:0 0 22px;height:22px;margin-top:16px;border-radius:50%;background:var(--gold)}
.cover-img{position:absolute;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
.tangle{position:absolute}
/* museum placard */
.placard{background:#fffdf7;border:2px solid #d9cdb0;box-shadow:0 30px 60px rgba(60,40,10,.18);padding:72px 70px;display:flex;flex-direction:column;gap:34px;color:var(--ink)}
.placard .no{font-weight:700;font-size:32px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep)}
.placard .t{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:88px;line-height:1.1}
.placard .meta{display:grid;grid-template-columns:230px 1fr;gap:18px 24px;font-size:42px;line-height:1.35}
.placard .meta dt{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:30px;padding-top:8px;color:#6b6250}
.placard .meta dd{font-weight:500}
.placard .q{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:50px;line-height:1.35;color:#3a404b;border-top:2px solid #e6dcc4;padding-top:22px}
.frame-gilt{position:absolute;inset:60px;border:14px solid var(--gold-deep);outline:4px solid rgba(251,195,18,.35);outline-offset:14px}
.chip{display:inline-block;background:var(--gold);color:var(--ink);font-weight:800;font-size:34px;letter-spacing:.06em;padding:20px 34px;border-radius:999px;text-transform:uppercase}
.price{display:flex;flex-direction:column;gap:18px}
.price .row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid rgba(244,237,220,.2);padding-bottom:18px;font-size:44px;font-weight:600}
.price .row b{color:var(--gold);font-weight:800}
.hl-icon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;height:640px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.hl-icon svg{width:300px;height:300px}
.hl-icon .lbl{font-weight:800;font-size:58px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.portrait{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,17,31,0) 30%,rgba(7,17,31,.85) 62%,#07111f 100%)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const TANGLE = (w, color) => `<svg class="tangle" viewBox="0 0 600 260" width="${w}" style="LEFT" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M140 120c-60-40-110 10-90 50s110 50 140 0-50-110-110-60-10 120 70 110 120-80 40-120-150 10-120 70 140 60 160-10-60-100-110-40 0 110 80 90"/>
<path d="M200 150c60 40 140 60 230 30s110-50 140-60"/>
<path d="M540 98l32 22-38 14" />
</svg>`;
const tangle = (w, style, color='#fbc312') => TANGLE(w, color).replace('style="LEFT"', `style="${style}"`);
const foot = (n, total, label='The Life You Keep Planning') => `<div class="foot"><span>${label}</span><span class="n">${n} / ${total}</span></div>`;
const ICONS = {
  start:`<svg viewBox="0 0 100 100" fill="none" stroke="#fbc312" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 62c10-18 22-6 30-16s-2-20 8-24 18 10 12 18"/><path d="M48 70h34"/><path d="M70 58l12 12-12 12"/></svg>`,
  book:`<svg viewBox="0 0 100 100" fill="none" stroke="#fbc312" stroke-width="6" stroke-linejoin="round"><path d="M50 26c-10-8-24-10-36-8v56c12-2 26 0 36 8 10-8 24-10 36-8V18c-12-2-26 0-36 8z"/><path d="M50 26v56"/></svg>`,
  select:`<svg viewBox="0 0 100 100" fill="none" stroke="#fbc312" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="28" r="8"/><circle cx="24" cy="72" r="8"/><circle cx="76" cy="50" r="12"/><path d="M32 30l30 14M32 70l30-14" stroke-dasharray="2 10"/><path d="M70 50l5 5 9-11"/></svg>`,
  author:`<svg viewBox="0 0 100 100" fill="none" stroke="#fbc312" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M70 14l16 16-46 46-22 6 6-22z"/><path d="M62 22l16 16"/><path d="M18 88h64"/></svg>`,
  launch:`<svg viewBox="0 0 100 100" fill="none" stroke="#fbc312" stroke-width="6" stroke-linejoin="round"><rect x="14" y="20" width="72" height="66" rx="8"/><path d="M14 38h72M32 12v14M68 12v14" stroke-linecap="round"/><text x="50" y="76" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="30" fill="#fbc312" stroke="none">23</text></svg>`

const hlCover = (key, label) => `<div class="frame story navy"><div class="hl-icon">${ICONS[key]}<div class="lbl">${label}</div></div></div>`;

const F = {

'p1-06':()=>`<div class="frame feed navy"><div class="pad"><div class="kicker">Your way out today</div>

const id = new URLSearchParams(location.search).get('id');
document.getElementById('root').innerHTML = F[id] ? F[id]() : '';
window.FRAME_IDS = Object.keys(F);
