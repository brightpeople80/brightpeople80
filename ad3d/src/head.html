<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stop Planning Start</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 100 900; src: url(../assets/fonts/Montserrat-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 200 900; src: url(../assets/fonts/SourceSerif4-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-style: italic; font-weight: 200 900; src: url(../assets/fonts/SourceSerif4-italic.woff2) format('woff2'); }
  :root { --navy: #0b1a31; --gold: #fbc312; --ivory: #f4eddc; }
  html, body { margin: 0; overflow: hidden; background: #0a1729; }
  #stage { position: relative; width: 1080px; overflow: hidden; }
  #c { position: absolute; left: 0; top: 0; width: 1080px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  /* top: the brand (wordmark, no logo file) */
  #brand { position: absolute; left: 0; right: 0; top: 64px; text-align: center; opacity: 0; }
  #brand .n { font: 800 34px Montserrat; letter-spacing: .3em; color: var(--gold); padding-left: .3em; }
  #brand .b { font: 700 22px Montserrat; letter-spacing: .34em; color: var(--ivory); opacity: .85; margin-top: 12px; padding-left: .34em; }
  /* bottom: the three-word slogan + one quiet line */
  #slogan { position: absolute; left: 0; right: 0; text-align: center; font: 600 104px/1 'Source Serif 4'; color: #fff; letter-spacing: -.01em; opacity: 0; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
  #slogan em { color: var(--gold); font-style: italic; }
  #sub { position: absolute; left: 0; right: 0; text-align: center; font: 700 26px Montserrat; letter-spacing: .08em; color: var(--ivory); opacity: 0; }
  #sub b { color: var(--gold); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="layer">
    <div id="brand"><div class="n">BELINDA BRIGHT N.</div><div class="b">THE LIFE YOU KEEP PLANNING</div></div>
    <div id="slogan">Stop planning. <em>Start.</em></div>
    <div id="sub">Kindle pre-order on Amazon UK · Out <b>23 January 2027</b></div>
  </div>
</div>
<script type="module">

document.getElementById('c').style.height = H + 'px';
document.getElementById('slogan').style.top = (FMT === 'story' ? 1370 : 1085) + 'px';
