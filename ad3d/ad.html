<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stop Planning Start</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 100 900; src: url(../assets/fonts/Montserrat-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 200 900; src: url(../assets/fonts/SourceSerif4-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-style: italic; font-weight: 200 900; src: url(../assets/fonts/SourceSerif4-italic.woff2) format('woff2'); }
  :root { --navy: #0b1a31; --gold: #fbc312; --ivory: #f4eddc; }
  html, body { margin: 0; overflow: hidden; background: #0a1729; }
  #stage { position: relative; width: 1080px; overflow: hidden; }
  #c { position: absolute; left: 0; top: 0; width: 1080px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  /* top: the brand (wordmark, no logo file) */
  #brand { position: absolute; left: 0; right: 0; top: 64px; text-align: center; opacity: 0; }
  #brand .n { font: 800 34px Montserrat; letter-spacing: .3em; color: var(--gold); padding-left: .3em; }
  #brand .b { font: 700 22px Montserrat; letter-spacing: .34em; color: var(--ivory); opacity: .85; margin-top: 12px; padding-left: .34em; }
  /* bottom: the three-word slogan + one quiet line */
  #slogan { position: absolute; left: 0; right: 0; text-align: center; font: 600 104px/1 'Source Serif 4'; color: #fff; letter-spacing: -.01em; opacity: 0; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
  #slogan em { color: var(--gold); font-style: italic; }
  #sub { position: absolute; left: 0; right: 0; text-align: center; font: 700 26px Montserrat; letter-spacing: .08em; color: var(--ivory); opacity: 0; }
  #sub b { color: var(--gold); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="layer">
    <div id="brand"><div class="n">BELINDA BRIGHT N.</div><div class="b">THE LIFE YOU KEEP PLANNING</div></div>
    <div id="slogan">Stop planning. <em>Start.</em></div>
    <div id="sub">Kindle pre-order on Amazon UK · Out <b>23 January 2027</b></div>
  </div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';
const params = new URLSearchParams(location.search);
const FMT = params.get('format') || 'feed';
const W = 1080, H = FMT === 'story' ? 1920 : 1350;
const DURATION = 8.0; window.DURATION = DURATION; window.SIZE = [W, H];
document.getElementById('stage').style.height = H + 'px';
document.getElementById('c').style.height = H + 'px';
document.getElementById('slogan').style.top = (FMT === 'story' ? 1370 : 1085) + 'px';
document.getElementById('sub').style.top = (FMT === 'story' ? 1505 : 1215) + 'px';
document.getElementById('brand').style.top = (FMT === 'story' ? 260 : 64) + 'px';
// ------------------------------------------------------------------ helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const k = (t, a, b) => clamp((t - a) / (b - a));
const sm = x => x * x * (3 - 2 * x);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bo = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ------------------------------------------------------------------ renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#07111f');
scene.fog = new THREE.Fog('#07111f', 90, 180);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environmentIntensity = 0.3;
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 300);

scene.add(new THREE.HemisphereLight('#c9d6f0', '#0b1424', 0.32));
const key = new THREE.DirectionalLight('#ffe9c4', 1.15);
key.position.set(-14, 26, 16); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0006;
Object.assign(key.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 80 });
scene.add(key);
const rim = new THREE.DirectionalLight('#8fb3ff', 0.55); rim.position.set(16, 10, -14); scene.add(rim);
const fill = new THREE.PointLight('#ffd38a', 6, 40, 1.6); fill.position.set(4, 9, 14); scene.add(fill);

// ------------------------------------------------------------------ textures
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  if (repeat) { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(repeat, repeat); }
  tx.userData = { cv, g, draw }; return tx;
}
const grain = (g, w, h, base, amt) => { g.fillStyle = base; g.fillRect(0, 0, w, h);
  const id = g.getImageData(0, 0, w, h); for (let i = 0; i < id.data.length; i += 4) { const n = (rnd() - .5) * amt; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n; } g.putImageData(id, 0, 0); };
const brushed = (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#d9b56a'); gr.addColorStop(.5, '#b08a3e'); gr.addColorStop(1, '#cfa75a');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < h * 1.4; i++) { g.strokeStyle = `rgba(${rnd() < .5 ? '255,240,200' : '60,40,10'},${rnd() * .12})`; g.lineWidth = rnd() * 1.4; const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (rnd() - .5) * 2); g.stroke(); } };
const loadTex = src => new Promise(r => new THREE.TextureLoader().load(src, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; r(t); }));

const navyTex = canvasTex(256, 256, (g, w, h) => grain(g, w, h, '#13284a', 14), 6);
const tableTex = canvasTex(256, 256, (g, w, h) => grain(g, w, h, '#0e2140', 12), 40);
const ivoryTex = canvasTex(256, 256, (g, w, h) => grain(g, w, h, '#f1e9d6', 10), 3);
const brassTex = canvasTex(512, 256, brushed);
const M = {
  navy: new THREE.MeshStandardMaterial({ map: navyTex, roughness: .92, metalness: 0 }),
  navyDeep: new THREE.MeshStandardMaterial({ color: '#0d1d36', map: navyTex, roughness: .95 }),
  ivory: new THREE.MeshStandardMaterial({ color: '#eee5cf', map: ivoryTex, roughness: .96 }),
  brass: new THREE.MeshStandardMaterial({ map: brassTex, metalness: .85, roughness: .32, envMapIntensity: 3.5 }),
  gold: new THREE.MeshStandardMaterial({ color: '#fbc312', emissive: '#f2b200', emissiveIntensity: .75, metalness: .3, roughness: .35 }),
  table: new THREE.MeshStandardMaterial({ map: tableTex, roughness: 1 }),
};
const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; };
const unitBox = mat => box(1, 1, 1, mat);
const faceMats = (side, front, back) => [side, side, side, side, front, back || side];

// ------------------------------------------------------------------ gold line
const Y = V(0, 1, 0);
function seg(r = .07) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), M.gold); m.visible = false; scene.add(m); return m; }
function setSeg(m, a, b, f = 1) {
  if (f <= 0.001) { m.visible = false; return; }
  const e = a.clone().lerp(b, f), d = e.clone().sub(a), L = d.length(); if (L < 1e-4) { m.visible = false; return; }
  m.visible = true; m.position.copy(a).add(e).multiplyScalar(.5); m.quaternion.setFromUnitVectors(Y, d.normalize()); m.scale.set(1, L, 1);
}
function tube(points, r = .07, segs = 240) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', .25);
  const g = new THREE.TubeGeometry(curve, segs, r, 8, false); const m = new THREE.Mesh(g, M.gold); m.userData.segs = segs; scene.add(m); return m;
}
const drawTube = (m, f) => { m.visible = f > 0.002; m.geometry.setDrawRange(0, Math.floor(clamp(f) * m.userData.segs) * 8 * 6); };
const dot = () => { const m = new THREE.Mesh(new THREE.SphereGeometry(.16, 16, 12), M.gold); m.visible = false; scene.add(m); return m; };

// ------------------------------------------------------------------ the surreal ad
// The book stands like a monument. Its cover scribble bursts out as a giant gold tangle,
// which straightens on the floor into the cover's arrow; a tiny figure walks out along it.
scene.fog = null;
scene.background = new THREE.Color('#0a1729');
const B = {};
async function build() {
  await Promise.all(['800 40px Montserrat', '600 40px "Source Serif 4"', 'italic 600 40px "Source Serif 4"'].map(f => document.fonts.load(f)));
  const [frontT, spineT, backT] = await Promise.all(['assets/front-cover.png', 'assets/spine.png', 'assets/back-cover.png'].map(loadTex));
  // seamless navy sweep (floor curving up into the wall)
  const sweepMat = new THREE.MeshStandardMaterial({ color: '#10233f', roughness: .95 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), sweepMat); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const curve = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 120, 48, 1, true, Math.PI, Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#10233f', roughness: .95, side: THREE.BackSide }));
  curve.rotation.z = Math.PI / 2; curve.position.set(0, 8, -10); curve.receiveShadow = true; scene.add(curve);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(120, 80), sweepMat); wall.position.set(0, 48, -18); scene.add(wall);
  // the book, a monument
  const book = new THREE.Group(); book.position.set(-1.0, 4.5, -.5); book.rotation.y = .38; scene.add(book); B.book = book;
  const pagesT = canvasTex(64, 512, (g, w, h) => { g.fillStyle = '#efe6d0'; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 2) { g.fillStyle = `rgba(120,100,70,${.08 + rnd() * .12})`; g.fillRect(x, 0, 1, h); } });
  const pagesTH = canvasTex(512, 64, (g, w, h) => { g.fillStyle = '#efe6d0'; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 2) { g.fillStyle = `rgba(120,100,70,${.08 + rnd() * .12})`; g.fillRect(0, y, w, 1); } });
  const pe = new THREE.MeshStandardMaterial({ map: pagesT, roughness: 1 }), peh = new THREE.MeshStandardMaterial({ map: pagesTH, roughness: 1 });
  const cover = new THREE.MeshStandardMaterial({ map: frontT, roughness: .55, envMapIntensity: .25 });
  const back = new THREE.MeshStandardMaterial({ map: backT, roughness: .55 }), spine = new THREE.MeshStandardMaterial({ map: spineT, roughness: .55 });
  const bk = new THREE.Mesh(new THREE.BoxGeometry(6, 9, .55), [pe, spine, peh, peh, cover, back]); bk.castShadow = bk.receiveShadow = true; book.add(bk);
  // the tangle bursts out of the cover's scribble and lands as a straight arrow path
  const scribble = book.localToWorld(V(-1.0, -1.85, .3));
  const pts = [scribble, scribble.clone().add(V(.5, .5, .9)), scribble.clone().add(V(1.6, 1.4, 1.6))];
  const C = V(3.0, 2.6, 3.4);
  for (let i = 0; i < 26; i++) { const a = i * 2.39996, r = .95 + .5 * Math.sin(i * 1.7), y = Math.sin(i * .9) * 1.15;
    pts.push(C.clone().add(V(Math.cos(a) * r, y, Math.sin(a) * r * .8))); }
  pts.push(V(2.6, .9, 4.4), V(2.75, .2, 5.0), V(3.0, .07, 5.2), V(3.25, .07, 5.38));
  const straightA = V(3.0, .07, 5.2), straightB = V(6.4, .07, 7.6);
  const tangle = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', .5);
  B.tangle = new THREE.Mesh(new THREE.TubeGeometry(tangle, 700, .085, 10, false), M.gold); B.tangle.castShadow = true; B.tangle.userData.segs = 875; /* 700 rings x 10 sides; drawTube counts 8 sides per ring */ scene.add(B.tangle);
  B.path = seg(.085); B.path.castShadow = true; B.pathA = straightA; B.pathB = straightB;
  const head = new THREE.Mesh(new THREE.ConeGeometry(.42, .9, 3), M.gold); head.castShadow = true; scene.add(head); B.head = head;
  // the tiny human: an architectural-model figure in warm ivory
  const fig = new THREE.Group(); scene.add(fig); B.fig = fig;
  const ivory = new THREE.MeshStandardMaterial({ color: '#efe6d2', roughness: .7 });
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.05, .13, 6, 12), ivory); torso.position.y = .27; fig.add(torso);
  const hd = new THREE.Mesh(new THREE.SphereGeometry(.042, 16, 12), ivory); hd.position.y = .4; fig.add(hd);
  B.legs = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(s * .026, .19, 0); const l = new THREE.Mesh(new THREE.CapsuleGeometry(.022, .14, 4, 8), ivory); l.position.y = -.09; p.add(l); fig.add(p); return p; });
  B.arms = [-1, 1].map(s => { const p = new THREE.Group(); p.position.set(s * .065, .33, 0); const a = new THREE.Mesh(new THREE.CapsuleGeometry(.016, .12, 4, 8), ivory); a.position.y = -.08; p.add(a); fig.add(p); return p; });
  fig.traverse(o => { if (o.isMesh) o.castShadow = true; });
  fig.scale.setScalar(2.2);
}
const CAMS = {
  feed: [[0, V(4.5, 8.5, 36), V(1.6, 3.0, 2.0)], [8, V(1.0, 7.6, 33), V(1.6, 3.0, 2.0)]],
  story: [[0, V(4.5, 9.0, 44), V(1.6, 2.4, 2.0)], [8, V(1.0, 8.2, 41), V(1.6, 2.4, 2.0)]],
};
function render(t) {
  const [[, p0, l0], [, p1, l1]] = CAMS[FMT], u = eio(k(t, 0, DURATION));
  camera.position.copy(p0).lerp(p1, u); camera.lookAt(l0.clone().lerp(l1, u)); camera.updateMatrixWorld();
  drawTube(B.tangle, eio(k(t, .2, 3.0)));
  const pf = eio(k(t, 2.9, 3.8)); setSeg(B.path, B.pathA, B.pathB, pf);
  const dir = B.pathB.clone().sub(B.pathA).normalize();
  const tip = B.pathA.clone().lerp(B.pathB, pf).add(dir.clone().multiplyScalar(.4));
  B.head.visible = pf > .02; B.head.position.copy(tip); B.head.quaternion.setFromUnitVectors(V(0, 1, 0), dir); B.head.rotateY(Math.PI / 6); B.head.scale.set(1, 1, .18);
  // the figure walks off the tangle and along the straight path
  const w = k(t, 3.4, 8.0), pos = B.pathA.clone().lerp(B.pathB, .1 + .55 * w); pos.y = .08;
  B.fig.visible = t > 3.2; B.fig.position.copy(pos); B.fig.rotation.y = Math.atan2(dir.x, dir.z);
  const ph = t * 7.5; B.legs[0].rotation.x = Math.sin(ph) * .55; B.legs[1].rotation.x = -Math.sin(ph) * .55; B.arms[0].rotation.x = -Math.sin(ph) * .5; B.arms[1].rotation.x = Math.sin(ph) * .5;
  renderer.render(scene, camera);
  const S = (id, a, dy) => { const el = document.getElementById(id), x = eo(k(t, a, a + .6)); el.style.opacity = x; el.style.transform = `translateY(${((1 - x) * dy).toFixed(1)}px)`; };
  S('brand', .4, -16); S('slogan', 4.6, 30); S('sub', 5.4, 16);
}
window.seek = t => render(t);
window.READY = (async () => { await build(); render(0); return true; })();
if (!params.has('render')) window.READY.then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); });
</script>
</body>
</html>
